<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Sementes - Agrinho 2026</title>
    <style>
        :root {
            --primary: #2e7d32;
            --secondary: #81c784;
            --background: #f1f8e9;
            --text: #333;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
        }
        .container {
            max-width: 600px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e8f5e9;
            border-left: 5px solid var(--primary);
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Agro Forte, Futuro Sustentável</h1>
        <p>Simulador de Sementes - Agrinho 2026</p>
    </header>

    <div class="container">
        <h2>Simulador de Cultivo</h2>
        <p>Descubra qual semente é ideal para o seu plantio de forma sustentável.</p>

        <div class="form-group">
            <label for="temperatura">Temperatura Média (°C):</label>
            <input type="number" id="temperatura" placeholder="Ex: 22">
        </div>

        <div class="form-group">
            <label for="agua">Quantidade de Água Necessária:</label>
            <select id="agua">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tempo">Tempo de Colheita Desejado (dias):</label>
            <input type="number" id="tempo" placeholder="Ex: 75">
        </div>

        <button onclick="simularSemente()">Simular Semente</button>

        <div class="result-box" id="resultado">
            <h3>Semente Recomendada:</h3>
            <p id="semente-texto"></p>
        </div>
    </div>

    <script>
        function simularSemente() {
            const temp = parseFloat(document.getElementById('temperatura').value);
            const agua = document.getElementById('agua').value;
            const tempo = parseInt(document.getElementById('tempo').value);
            const resultBox = document.getElementById('resultado');
            const sementeTexto = document.getElementById('semente-texto');

            if (isNaN(temp) || isNaN(tempo)) {
                alert("Por favor, preencha todos os campos numéricos corretamente.");
                return;
            }

            let semente = "";

            if (temp >= 15 && temp <= 20 && agua === 'media' && tempo <= 60) {
                semente = "<strong>Alface:</strong> Ciclo curto, menor consumo de água por safra e ótimo para climas amenos.";
            } else if (temp > 20 && temp <= 25 && agua === 'baixa' && tempo <= 90) {
                semente = "<strong>Feijão:</strong> Excelente para rotação sustentável. Fixa nitrogênio no solo, reduzindo a necessidade de fertilizantes.";
            } else if (temp > 24 && temp <= 30 && agua === 'alta' && tempo > 90) {
                semente = "<strong>Milho:</strong> Base da alimentação, pode ser usado em rotação de culturas para manter o solo rico e produtivo.";
            } else {
                semente = "Nenhuma semente padrão encontrada para os parâmetros informados. <em>Dica: Tente testar com Temperatura de 22°C, Água Baixa e 75 dias (Feijão) para um resultado positivo.</em>";
            }

            sementeTexto.innerHTML = semente;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
